# Reads the repo-root .env. Run from the repo root:
#   docker compose --env-file .env -f infra/docker-compose.yml up -d
# (or `bun run docker:up`)
name: identitycard

services:
    postgres:
        image: ${POSTGRES_IMAGE:-postgres:17-alpine}
        container_name: ${POSTGRES_CONTAINER_NAME:-identitycard-postgres}
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-identitycard}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-identitycard}
            POSTGRES_DB: ${POSTGRES_DB:-identitycard}
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        restart: unless-stopped
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 5s

    migrate:
        image: ${MIGRATE_IMAGE:-migrate/migrate:v4.19.1}
        container_name: ${MIGRATE_CONTAINER_NAME:-identitycard-migrate}
        restart: "no"
        depends_on:
            postgres:
                condition: service_healthy
        volumes:
            - ../apps/server/internal/migrations:/migrations:ro
        command:
            - "-path=/migrations"
            - "-database=postgres://${POSTGRES_USER:-identitycard}:${POSTGRES_PASSWORD:-identitycard}@postgres:5432/${POSTGRES_DB:-identitycard}?sslmode=disable"
            - "up"

    redis:
        image: ${REDIS_IMAGE:-redis:7-alpine}
        container_name: ${REDIS_CONTAINER_NAME:-identitycard-redis}
        command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in the root .env}"]
        environment:
            REDISCLI_AUTH: ${REDIS_PASSWORD}
        ports:
            - "${REDIS_PORT:-6379}:6379"
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5

    # S3-compatible storage for uploaded event sites (R2/S3 in production).
    # The API creates the bucket on first start.
    minio:
        image: ${MINIO_IMAGE:-minio/minio:latest}
        container_name: ${MINIO_CONTAINER_NAME:-identitycard-minio}
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in the root .env}
            MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in the root .env}
        ports:
            - "${MINIO_API_PORT:-9100}:9000"
            - "${MINIO_CONSOLE_PORT:-9101}:9001"
        restart: unless-stopped
        volumes:
            - miniodata:/data
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 5s

volumes:
    pgdata:
    miniodata:

